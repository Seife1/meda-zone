[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder only — env.py overrides this at runtime with settings.DATABASE_URL
# (postgresql+asyncpg://medazone:medazone_dev@localhost:5432/medazone)
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost/medazone

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
version_locations = %(here)s/alembic/versions

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
