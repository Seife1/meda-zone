services:
  # NOTE: Do NOT run `docker compose down -v` unless you want to wipe the DB.
  # The PostgreSQL data lives in the named volume `medazone_postgres_data`.

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  medazone_postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: medazone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       medazone
      POSTGRES_USER:     medazone
      POSTGRES_PASSWORD: medazone_dev
    volumes:
      - medazone_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medazone -d medazone"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  medazone_redis:
    image: redis:7-alpine
    container_name: medazone_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - medazone_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  medazone_backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: medazone_backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST:     medazone_postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       medazone
      POSTGRES_USER:     medazone
      POSTGRES_PASSWORD: medazone_dev
      REDIS_HOST:        medazone_redis
      REDIS_PORT:        6379
      SECRET_KEY:        dev-secret-key-replace-in-production-32chars
      DEBUG:             "true"
      ENVIRONMENT:       development
      BACKEND_CORS_ORIGINS: '["http://localhost:5174","http://localhost:3000","http://192.168.1.5:5174","http://192.168.1.5:8001"]'
    ports:
      - "8001:8000"
    depends_on:
      medazone_postgres: { condition: service_healthy }
      medazone_redis:    { condition: service_healthy }
    volumes:
      - ../backend:/app
    env_file:
      - ../.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Admin Web (dev, Vite) ────────────────────────────────────────────────────
  medazone_admin:
    image: node:20-alpine
    container_name: medazone_admin
    working_dir: /app
    volumes:
      - ../admin-web:/app
      - /app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    env_file:
      - ../.env
    environment:
      # Inside Docker, proxy to the backend service name on its internal port
      VITE_API_PROXY_HOST: medazone_backend
      VITE_API_PROXY_PORT: "8000"
    ports:
      - "5174:5174"
    depends_on:
      - medazone_backend

volumes:
  medazone_postgres_data:
  medazone_redis_data:
