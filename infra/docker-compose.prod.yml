services:
  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  medazone_postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: medazone_postgres
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - medazone_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  medazone_redis:
    image: redis:7-alpine
    container_name: medazone_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - medazone_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  medazone_backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: medazone_backend
    restart: always
    environment:
      POSTGRES_HOST:            medazone_postgres
      POSTGRES_DB:              ${POSTGRES_DB}
      POSTGRES_USER:            ${POSTGRES_USER}
      POSTGRES_PASSWORD:        ${POSTGRES_PASSWORD}
      REDIS_HOST:               medazone_redis
      REDIS_PASSWORD:           ${REDIS_PASSWORD}
      SECRET_KEY:               ${SECRET_KEY}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH}
      CHAPA_SECRET:             ${CHAPA_SECRET}
      ARIFPAY_SECRET:           ${ARIFPAY_SECRET}
      CHAPA_WEBHOOK_SECRET:     ${CHAPA_WEBHOOK_SECRET}
      BACKEND_CORS_ORIGINS:     ${BACKEND_CORS_ORIGINS}
      ENVIRONMENT:              production
      DEBUG:                    "false"
    depends_on:
      medazone_postgres:
        condition: service_healthy
      medazone_redis:
        condition: service_healthy
    env_file:
      - ../.env

  # ── Admin Web (production build served by Nginx) ─────────────────────────────
  medazone_admin:
    build:
      context: ../admin-web
      dockerfile: Dockerfile
    container_name: medazone_admin
    restart: always
    depends_on:
      - medazone_backend

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  medazone_nginx:
    image: nginx:alpine
    container_name: medazone_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - medazone_nginx_certs:/etc/nginx/certs
    depends_on:
      - medazone_backend
      - medazone_admin

volumes:
  medazone_postgres_data:
  medazone_redis_data:
  medazone_nginx_certs:
