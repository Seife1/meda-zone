worker_processes auto;
events { worker_connections 2048; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript;

  # Rate limiting — applied to all /api/v1 routes
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # ── Upstreams ────────────────────────────────────────────────────────────────
  upstream medazone_backend { server medazone_backend:8000; }
  upstream medazone_admin   { server medazone_admin:80; }

  server {
    listen 80;
    server_name _;

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/v1/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass         http://medazone_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── WebSocket — slot availability fanout ─────────────────────────────────
    location /ws/ {
      proxy_pass         http://medazone_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_read_timeout 3600s;
    }

    # ── OpenAPI docs (disable or restrict in production) ─────────────────────
    location /docs          { proxy_pass http://medazone_backend; }
    location /redoc         { proxy_pass http://medazone_backend; }
    location /openapi.json  { proxy_pass http://medazone_backend; }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
      proxy_pass http://medazone_backend/health;
      access_log off;
    }

    # ── Admin web SPA (catch-all) ─────────────────────────────────────────────
    location / {
      proxy_pass       http://medazone_admin;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # SPA fallback — let admin container handle 404 → index.html
    }
  }
}
