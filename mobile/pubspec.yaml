name: medazone
description: MedaZone — Discover football fields & book playing time in Addis Ababa

publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.3
  path: ^1.9.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.3.1

  # Push notifications
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1
  flutter_local_notifications: ^17.1.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  url_launcher: ^6.3.0

  # WebSocket
  web_socket_channel: ^3.0.1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_light.png
    - assets/images/logo_dark.png

  # Fix #17: Inter font bundled locally — prevents fallback to system font in
  # low-connectivity conditions. Font files must be placed in assets/fonts/.
  # Download from https://fonts.google.com/specimen/Inter
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
